<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Последний адрес</title><body style="background:#101820;color:#eee;font:16px system-ui;padding:2rem">Открываем материалы дела…<script>fetch('app.html.gz').then(r=>{if(!r.ok)throw Error('Не удалось загрузить приложение');return r.arrayBuffer()}).then(b=>new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()).then(h=>{document.open();document.write(h);document.close()}).catch(e=>{document.body.textContent='Не удалось загрузить игру. Обновите страницу или попробуйте позже.';console.error(e)})</script></body></html>
