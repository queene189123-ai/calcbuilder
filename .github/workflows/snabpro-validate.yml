name: Validate SnabPro changes

on:
  push:
    branches: [fix/gmail-monitor-relevant-senders]
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "supabase/functions/**"
      - ".github/workflows/snabpro-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript
        run: |
          node --check public/app.js
          node --check public/auth.js
          node --check public/gmail.js
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check changed Edge Functions
        run: |
          deno check --no-lock supabase/functions/gmail-monitor/index.ts
          deno check --no-lock supabase/functions/gmail-attachment-reader-v2/index.ts
          deno check --no-lock supabase/functions/quote-document-parser/index.ts
